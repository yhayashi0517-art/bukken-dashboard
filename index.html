<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売出中・成約済み物件検索</title>
  <base href="./">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <h1>売出中・成約済み物件検索</h1>
      <p id="updated-at" class="subtitle">データ読み込み中...</p>
    </div>
    <button id="reload-btn" class="btn btn-secondary" type="button">再読み込み</button>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar" aria-label="検索・フィルター">
      <div class="sidebar-inner">
        <div class="sidebar-block">
          <label class="field-label" for="search-input">検索</label>
          <input type="search" id="search-input" class="field-input" placeholder="物件名・住所">
        </div>

        <div class="sidebar-block filter-station-group">
          <span class="field-label">駅（最大5件）</span>
          <div id="filter-station" class="station-picker"></div>
        </div>

        <div class="sidebar-block">
          <label class="field-label" for="filter-status">表示対象</label>
          <select id="filter-status" class="field-input">
            <option value="active">売り出し中のみ</option>
            <option value="sold">成約物件のみ</option>
            <option value="bargain">割安物件のみ</option>
            <option value="all">すべて</option>
          </select>
        </div>

        <div class="sidebar-block filter-layout-group">
          <span class="field-label">間取り</span>
          <div id="filter-layout" class="layout-filter"></div>
        </div>

        <div class="sidebar-block">
          <span class="field-label">階数</span>
          <label class="toggle-option" for="filter-floor-min2">
            <input type="checkbox" id="filter-floor-min2">
            <span>2階以上</span>
          </label>
        </div>

        <div class="sidebar-block filter-direction-group">
          <span class="field-label">方角</span>
          <div id="filter-direction" class="direction-filter"></div>
        </div>

        <div class="sidebar-block filter-range-group">
          <div id="filter-price" class="range-filter" data-range-id="price"></div>
          <div id="filter-area" class="range-filter" data-range-id="area"></div>
          <div id="filter-age" class="range-filter" data-range-id="age"></div>
          <div id="filter-walk" class="range-filter" data-range-id="walk"></div>
          <div id="filter-bargain" class="range-filter" data-range-id="bargain"></div>
        </div>

        <div class="sidebar-block">
          <span class="field-label">お気に入り</span>
          <label class="toggle-option" for="filter-favorites-only">
            <input type="checkbox" id="filter-favorites-only">
            <span>お気に入りのみ表示</span>
          </label>
          <p id="favorites-count" class="favorites-count">0件登録</p>
        </div>

        <div class="sidebar-block saved-search-block">
          <span class="field-label">保存した検索条件</span>
          <div class="saved-search-form">
            <input
              type="text"
              id="saved-search-name"
              class="field-input"
              placeholder="条件名（空欄で自動）"
              maxlength="40"
            >
            <button id="save-search-btn" class="page-btn" type="button">現在の条件を保存</button>
          </div>
          <div id="saved-search-list" class="saved-search-list" aria-live="polite"></div>
        </div>

        <div class="sidebar-block sidebar-actions">
          <button id="clear-filters-btn" class="page-btn filter-clear-btn" type="button">
            条件をすべてクリア
          </button>
        </div>
      </div>
    </aside>

    <div class="main-panel">
      <section class="market-summary" id="market-summary"></section>

      <p id="result-count" class="result-count">表示中: - 件</p>

      <main class="table-panel">
        <div class="property-table-wrapper">
          <div class="property-table">
            <div id="property-list-header" class="property-list-header"></div>
            <div id="property-list" class="property-list"></div>
          </div>
        </div>
        <p id="empty-message" class="empty-message" hidden>条件に一致する物件がありません。</p>
        <nav id="pagination-bottom" class="pagination" aria-label="ページ送り"></nav>
      </main>

      <section id="archived-favorites-panel" class="archived-favorites-panel" hidden>
        <div class="archived-favorites-header">
          <h2>お気に入り（掲載終了）</h2>
          <p class="archived-favorites-note">
            SUUMO の掲載が終了した物件、または成約済みになったお気に入り物件です。
          </p>
        </div>
        <div id="archived-favorites-list" class="archived-favorites-list"></div>
      </section>
    </div>
  </div>

  <script src="app.js?v=36"></script>
</body>
</html>
