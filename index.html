<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不動産ダッシュボード</title>
  <base href="./">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="header-logo" aria-hidden="true">◈</div>
      <div>
        <h1>不動産物件ダッシュボード</h1>
        <p id="updated-at" class="subtitle">データ読み込み中...</p>
      </div>
    </div>
    <button id="reload-btn" class="btn btn-ghost" type="button">データ再読み込み</button>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar" aria-label="検索・フィルター">
      <div class="sidebar-inner">
        <h2 class="sidebar-title">検索・フィルター</h2>

        <div class="sidebar-block">
          <label class="field-label" for="search-input">キーワード検索</label>
          <input type="search" id="search-input" class="field-input" placeholder="物件名・住所で検索...">
        </div>

        <div class="sidebar-block filter-station-group">
          <span class="field-label">駅で絞り込み（最大5駅）</span>
          <div id="filter-station" class="station-picker"></div>
        </div>

        <div class="sidebar-block">
          <label class="field-label" for="filter-status">表示対象</label>
          <select id="filter-status" class="field-input">
            <option value="active">売り出し中のみ</option>
            <option value="sold">成約物件のみ</option>
            <option value="bargain">割安物件のみ</option>
            <option value="all">すべて</option>
          </select>
        </div>

        <div class="sidebar-block filter-layout-group">
          <span class="field-label">間取り（複数選択可）</span>
          <div id="filter-layout" class="chip-filter"></div>
        </div>

        <div class="sidebar-block filter-range-group">
          <div id="filter-area" class="range-filter" data-range-id="area"></div>
          <div id="filter-age" class="range-filter" data-range-id="age"></div>
          <div id="filter-walk" class="range-filter" data-range-id="walk"></div>
          <div id="filter-bargain" class="range-filter" data-range-id="bargain"></div>
        </div>
      </div>
    </aside>

    <div class="main-panel">
      <section class="stats" id="stats">
        <div class="stat-card">
          <span class="stat-label">全物件</span>
          <span class="stat-value" id="stat-total">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">売り出し中</span>
          <span class="stat-value stat-value--cyan" id="stat-active">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">成約済み</span>
          <span class="stat-value" id="stat-sold">-</span>
        </div>
        <div class="stat-card stat-card--accent">
          <span class="stat-label">割安物件</span>
          <span class="stat-value stat-value--green" id="stat-bargain">-</span>
        </div>
      </section>

      <section class="market-summary" id="market-summary"></section>

      <div class="content-toolbar">
        <p id="result-count" class="result-count">表示中: - 件</p>
        <nav id="pagination-top" class="pagination" aria-label="ページ送り（上部）"></nav>
      </div>

      <main class="table-panel">
        <div class="property-table-wrapper">
          <div class="property-table">
            <div id="property-list-header" class="property-list-header"></div>
            <div id="property-list" class="property-list"></div>
          </div>
        </div>
        <p id="empty-message" class="empty-message" hidden>条件に一致する物件がありません。</p>
        <nav id="pagination-bottom" class="pagination pagination--bottom" aria-label="ページ送り（下部）"></nav>
      </main>
    </div>
  </div>

  <script src="app.js?v=24"></script>
</body>
</html>
