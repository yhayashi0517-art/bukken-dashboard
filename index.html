<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売出中・成約済み物件検索</title>
  <base href="./">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <h1>売出中・成約済み物件検索</h1>
      <p id="updated-at" class="subtitle">データ読み込み中...</p>
    </div>
    <button id="reload-btn" class="btn btn-secondary" type="button">再読み込み</button>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar" aria-label="検索・フィルター">
      <div class="sidebar-inner">
        <div class="sidebar-block">
          <label class="field-label" for="search-input">検索</label>
          <input type="search" id="search-input" class="field-input" placeholder="物件名・住所">
        </div>

        <div class="sidebar-block filter-station-group">
          <span class="field-label">駅（最大5件）</span>
          <div id="filter-station" class="station-picker"></div>
        </div>

        <div class="sidebar-block">
          <label class="field-label" for="filter-status">表示対象</label>
          <select id="filter-status" class="field-input">
            <option value="active">売り出し中のみ</option>
            <option value="sold">成約物件のみ</option>
            <option value="bargain">割安物件のみ</option>
            <option value="all">すべて</option>
          </select>
        </div>

        <div class="sidebar-block filter-layout-group">
          <span class="field-label">間取り</span>
          <div id="filter-layout" class="layout-filter"></div>
        </div>

        <div class="sidebar-block filter-range-group">
          <div id="filter-area" class="range-filter" data-range-id="area"></div>
          <div id="filter-age" class="range-filter" data-range-id="age"></div>
          <div id="filter-walk" class="range-filter" data-range-id="walk"></div>
          <div id="filter-bargain" class="range-filter" data-range-id="bargain"></div>
        </div>
      </div>
    </aside>

    <div class="main-panel">
      <section class="market-summary" id="market-summary"></section>

      <p id="result-count" class="result-count">表示中: - 件</p>

      <main class="table-panel">
        <div class="property-table-wrapper">
          <div class="property-table">
            <div id="property-list-header" class="property-list-header"></div>
            <div id="property-list" class="property-list"></div>
          </div>
        </div>
        <p id="empty-message" class="empty-message" hidden>条件に一致する物件がありません。</p>
        <nav id="pagination-bottom" class="pagination" aria-label="ページ送り"></nav>
      </main>
    </div>
  </div>

  <script src="app.js?v=28"></script>
</body>
</html>
